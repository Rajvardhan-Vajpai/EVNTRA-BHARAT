<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Eventra Bharat</title>

    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

    <div class="profile-container">

        <div class="profile-card">

            <img
                id="profileImage"
                src=""

            <h1 id="profileName">
                User Name
            </h1>

            <p id="profileEmail">
                user@email.com

            <p id="profileRole">

            </button>

    </div>

    <script src="../js/login.js"></script>

    <script>
        loadProfile();
    </script>
